name: scheduled-rebuild

# Weekly no-cache rebuild of main HEAD against a fresh bun/alpine base, so the
# Dockerfile's `apk upgrade` actually re-runs. Typecheck + unit tests first.
# Published as `sha-<7hex>-b<YYYYMMDD>` + `weekly`; the plain sha tag the
# cluster pins is never overwritten.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Install deps
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test tests/

      - name: Resolve tag
        id: rel
        run: |
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (loaded locally so the smoke-tested image is what gets pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.rel.outputs.short }}-b${{ steps.rel.outputs.build }}
            ${{ env.IMAGE }}:weekly
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rel.outputs.short }}

      - name: Smoke test (serves the UI)
        env:
          REF: ${{ env.IMAGE }}:sha-${{ steps.rel.outputs.short }}-b${{ steps.rel.outputs.build }}
        run: |
          docker run -d --name gpm -p 3000:3000 \
            -e PHOTON_USER_AGENT="gas-price-monitor-ci" -e OSRM_USER_AGENT="gas-price-monitor-ci" "$REF"
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:3000/ && break; sleep 1; done
          curl -fsS http://localhost:3000/ | grep -qi '<html' || { docker logs gpm; exit 1; }
          docker rm -f gpm

      - name: Push
        env:
          TAG: sha-${{ steps.rel.outputs.short }}-b${{ steps.rel.outputs.build }}
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:weekly"

      - name: Keep schedule alive
        # GitHub disables scheduled workflows after 60 days without repo
        # activity; re-enabling resets the inactivity timer.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scheduled-rebuild.yml/enable"
